name: PR Labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Add required labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['ai-generated', 'github-copilot'];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const existing = await github.paginate(github.rest.issues.listLabelsForIssue, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existingNames = new Set(existing.map(label => label.name));
            const missing = labels.filter(label => !existingNames.has(label));

            if (missing.length === 0) {
              core.info('All required labels already present.');
              return;
            }

            for (const label of missing) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: 'ededed'
                  });
                } else {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: missing
            });
